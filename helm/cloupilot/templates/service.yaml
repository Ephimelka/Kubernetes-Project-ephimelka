apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloupilot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloupilot.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cloupilot.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
