apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloupilot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloupilot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloupilot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloupilot.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        env:
        - name: APP_ENV
          value: {{ .Values.app.env | quote }}
        - name: APP_VERSION
          value: {{ .Values.app.version | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 3
          periodSeconds: 5
