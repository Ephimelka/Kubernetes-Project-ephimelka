# Number of pod replicas to run
replicaCount: 2

# Docker image settings
image:
  repository: cloudpilot
  tag: "1.0.0"
  pullPolicy: Never

# Application environment variables
app:
  env: "development"
  version: "1.0.0"

# Service settings
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Resource requests and limits
resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

# Ingress settings
ingress:
  host: cloupilot.local
