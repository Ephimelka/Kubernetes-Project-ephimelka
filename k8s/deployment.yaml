apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloupilot
  namespace: cloupilot
  labels:
    app: cloupilot
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloupilot
  template:
    metadata:
      labels:
        app: cloupilot
        version: "1.0.0"
    spec:
      containers:
        - name: cloupilot
          image: cloudpilot:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "development"
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
